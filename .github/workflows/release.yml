name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x android-app/gradlew

      - name: Build Android APK
        working-directory: android-app
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Release Asset
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            [ -z "$TAG" ] && TAG="latest"
          fi
          mkdir -p release-artifacts
          cp android-app/app/build/outputs/apk/debug/app-debug.apk "release-artifacts/Sahaaya-${TAG}.apk"
          cp android-app/app/build/outputs/apk/debug/app-debug.apk "release-artifacts/app-debug.apk"
          echo "Release artifacts prepared:"
          ls -lh release-artifacts/

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag_name != ''
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag_name }}
          files: |
            release-artifacts/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK Build Artifact (Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: Sahaaya-apk
          path: release-artifacts/*.apk
          retention-days: 30
